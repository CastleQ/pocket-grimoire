<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 받기 - Pocket Grimoire PLUS+ by Castle_Q</title>
<style>
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:#efe6d6 url("build/img/parchment-bg.webp") center / cover no-repeat; }
  :root { --bg:#d9d6cf; --text:#1c1c1c; --btn:#7ba7cc; --btn-border:#46637e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background-color:#efe6d6; color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:420px; text-align:center; }
  .title { font-size:1.6rem; font-weight:800; line-height:1.4; margin-bottom:28px; }
  /* ST앱 [캐릭터 배포](.button) 디자인 차용 — 크기(width/padding/font/margin)는 현행 유지 */
  .btn { display:block; width:100%; padding:16px; font-size:1.1rem; font-weight:700; cursor:pointer; margin-top:14px;
         color:#000; background-color:#679fd0; border:2px solid #000; border-radius:5px;
         box-shadow: inset 2px 2px 4px rgba(255,255,255,.3), inset -2px -2px 4px rgba(0,0,0,.3), 2px 2px 4px rgba(0,0,0,.4); }
  .btn:disabled { opacity:.7; box-shadow:none; color:#333; border-color:#333; filter:grayscale(.5); cursor:not-allowed; }
  .btn-row { display:flex; gap:12px; }
  .btn-row .btn { margin-top:0; }
  .hidden { display:none !important; }
  .char-icon { width:140px; height:140px; margin:0 auto 16px; border-radius:12px; background:rgba(0,0,0,.06); opacity:0; transition:opacity 3.5s ease-in; display:flex; align-items:center; justify-content:center; }
  .char-icon.show { opacity:1; }
  .char-icon img { max-width:100%; max-height:100%; }
  .char-name { font-size:1.8rem; font-weight:800; margin-bottom:10px; }
  .char-ability { font-size:1.05rem; line-height:1.6; margin-bottom:24px; }
  .name-label { font-size:1.3rem; font-weight:800; margin:18px 0 10px; }
  .name-input { width:100%; padding:14px; font-size:1.1rem; border:3px solid #333; border-radius:6px; text-align:center; }
  .msg { font-size:1.15rem; line-height:1.7; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal { background:#efe6d6 url("build/img/parchment-bg.webp") center / cover no-repeat; border:3px solid var(--btn-border); border-radius:10px; padding:24px; max-width:340px; width:100%; text-align:center; }
  .modal p { font-size:1.1rem; line-height:1.5; margin:0 0 20px; }
  /* 캐릭터 가이드(공식 위키 번역) — 뽑기 화면 위에 전체 화면으로 덮는다.
     페이지를 떠나지 않으므로 캐릭터 화면과 이탈 방지 장치가 그대로 유지된다. */
  .guide-frame { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; background:#2b1633; }
  .guide-frame__bar { flex:0 0 auto; display:flex; justify-content:flex-end; padding:8px; }
  .guide-frame__bar .btn { width:auto; margin:0; padding:8px 18px; font-size:1rem; }
  /* 이름을 보낸 뒤 무심코 창을 닫지 않도록 [위키 읽어보기] 버튼 테두리가 흐르고 빛이 깜빡인다. */
  .btn--guide { border:3px solid transparent;
         background: linear-gradient(#679fd0,#679fd0) padding-box, linear-gradient(90deg,#ffd35c,#ff7a3d,#e0409a,#7b5cff,#3cc8e0,#ffd35c) 0 0 / 300% 100% border-box;
         animation: guide-border 3s linear infinite, guide-glow 1.6s ease-in-out infinite; }
  @keyframes guide-border { to { background-position: 0 0, 300% 0; } }
  @keyframes guide-glow { 0%,100% { box-shadow: inset 2px 2px 4px rgba(255,255,255,.3), inset -2px -2px 4px rgba(0,0,0,.3), 0 0 4px 1px rgba(255,190,70,.35); }
                          50% { box-shadow: inset 2px 2px 4px rgba(255,255,255,.3), inset -2px -2px 4px rgba(0,0,0,.3), 0 0 18px 6px rgba(255,190,70,.9); } }
  @media (prefers-reduced-motion: reduce) { .btn--guide { animation:none; } }
  /* 앱의 경고 버튼(.button--warning)과 같은 연주황 */
  .btn--cancel { background-color:#d09f67; }
  .warn-head { color:#c0141b; font-weight:800; }
  #guide-warn-overlay .modal p { word-break:keep-all; }
  .guide-frame iframe { flex:1 1 auto; width:100%; border:0; background:#efe6d6; }
  .brand { display:block; width:80%; height:auto; margin:32px auto 0; }
  /* 플레이팁 댓글 — 완료 화면 위키 버튼 아래에 펼친 채로 나열 */
  .tips { margin-top:22px; text-align:left; display:flex; flex-direction:column; gap:10px; }
  .tips-write { display:flex; flex-direction:column; }
  .tips-write textarea { display:block; width:100%; font:inherit; font-size:1rem; line-height:1.4; padding:8px 10px; border:2px solid #333; border-radius:6px; resize:none; overflow:hidden; background:#fff; color:var(--text); }
  /* 앱 본체의 .button(시나리오 선택 등)과 같은 얇은 두께 */
  .tips-write .btn { margin-top:8px; padding:0 .5em; font-size:.85rem; font-weight:400; line-height:1.4; border-width:1px; border-radius:.2em;
         box-shadow: inset .1em .1em .2em rgba(255,255,255,.3), inset -.1em -.1em .2em rgba(0,0,0,.3), .1em .1em .2em rgba(0,0,0,.4); }
  .tips-write textarea::placeholder { font-size:var(--tip-ph-size, 1rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tips-empty { text-align:center; padding:12px 6px; line-height:1.6; }
  .tips-list { display:flex; flex-direction:column; gap:8px; }
  .tip { background:#f8f2e6; border:1px solid #cbbfa8; border-radius:6px; padding:9px 10px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; }
  .tip.is-pending { opacity:.55; }
  .tip-body { line-height:1.5; min-width:0; word-break:keep-all; overflow-wrap:anywhere; white-space:pre-wrap; }
  .tip-meta { grid-column:1; font-size:.78rem; color:#5b5348; display:flex; gap:8px; align-items:center; }
  .tip-mine { background:#2b1633; color:#fff; border-radius:3px; padding:0 5px; }
  .tip-del { color:#a33; text-decoration:underline; cursor:pointer; background:none; border:0; padding:0; font:inherit; }
  .tip-heart { grid-column:2; grid-row:1 / span 2; align-self:center; display:flex; flex-direction:column; align-items:center; background:none; border:0; cursor:pointer; color:#5b5348; font:inherit; font-size:.8rem; padding:2px 4px; }
  .tip-heart svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .15s; }
  .tip-heart.on { color:#d23a4f; } .tip-heart.on svg { fill:currentColor; }
  .tip-heart:active svg { transform:scale(1.3); }
  .tip-heart:disabled { opacity:.35; cursor:default; }
  .tips-more { background:none; border:0; color:#5b5348; font:inherit; cursor:pointer; padding:6px; }
  @media (prefers-reduced-motion: reduce) { .tip-heart svg { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="screen-gate">
    <div class="title" id="gate-title" style="visibility: hidden; word-break: keep-all;">실제로 플레이 할<br>사람만 확인 해주세요!</div>
    <button class="btn" id="btn-reveal">내 캐릭터 확인하기</button>
    <img class="brand" src="img/by-castle-q.webp" alt="by Castle_Q" width="523" height="197">
  </div>
  <div id="screen-char" class="hidden">
    <div class="char-icon" id="char-icon"></div>
    <div class="char-name" id="char-name"></div>
    <div class="char-ability" id="char-ability"></div>
    <div class="name-label">이름 입력</div>
    <input class="name-input" id="player-name" type="text" placeholder="이름을 입력하세요" autocomplete="off">
    <button class="btn" id="btn-submit">이야기꾼에게 보내기</button>
  </div>
  <div id="screen-done" class="hidden">
    <div class="msg" id="done-msg"></div>
    <div class="msg hidden" id="guide-tip">기다리는 동안 뽑은 캐릭터의 플레이 팁을 아래에서 확인하세요↓</div>
    <div class="msg hidden" id="close-tip">이 창은 닫으셔도 됩니다.</div>
    <button class="btn btn--guide hidden" id="btn-guide-done" data-guide-open>캐릭터 공식 Wiki 읽어보기</button>
    <div class="tips hidden" id="tips">
      <div class="tips-write">
        <textarea id="tip-input" rows="1" maxlength="300" aria-label="플레이 팁 쓰기"></textarea>
        <button class="btn" id="tip-send">쓰기</button>
      </div>
      <div class="tips-empty hidden" id="tips-empty">아직 아무도 남기지 않았어요.<br><b>이 캐릭터의 첫 기록</b>을 남겨주세요.</div>
      <div class="tips-list" id="tips-list"></div>
      <button class="tips-more hidden" id="tips-more">더 보기 ↓</button>
    </div>
  </div>
</div>
<div id="confirm-overlay" class="overlay hidden">
  <div class="modal">
    <p>정말 확인하시겠어요?<br>캐릭터는 <b>한 번만</b> 볼 수 있어요.</p>
    <div class="btn-row">
      <button class="btn" id="confirm-no">아니오</button>
      <button class="btn" id="confirm-yes">네</button>
    </div>
  </div>
</div>
<div id="guide-warn-overlay" class="overlay hidden">
  <div class="modal">
    <p><span class="warn-head">※잠깐!!※</span><br>다음 페이지에 당신의 캐릭터가 보입니다.<br>옆 사람에게 화면이 보이지 않도록 주의하세요.</p>
    <div class="btn-row">
      <button class="btn btn--cancel" id="guide-warn-no">취소</button>
      <button class="btn" id="guide-warn-yes">열기</button>
    </div>
  </div>
</div>
<div id="guide-frame" class="guide-frame hidden">
  <div class="guide-frame__bar"><button class="btn" id="guide-close">닫기</button></div>
  <iframe id="guide-iframe" title="캐릭터 가이드" src="about:blank"></iframe>
</div>
<script>
const SUPABASE_URL = "https://kxttcvygubixhfwhvyqa.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dHRjdnlndWJpeGhmd2h2eXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTE3NjIsImV4cCI6MjA5Nzk2Nzc2Mn0.6lo08bfZ9_RDo8V7y6H8WJJByFgfM2IYZonLRoOW7iI";

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const STORAGE_KEY = "pg_claim_" + gameId;
const el = function (id) { return document.getElementById(id); };
let claimState = null;
let unloadGuardActive = false;
// 캐릭터 가이드: 번역이 있는 캐릭터 목록(guide/data/index.json)과, 가이드를 열어도 되는 상태인지.
// 이름을 이야기꾼에게 보낸 뒤의 완료 화면에서만 연다(가이드를 읽느라 이름 보내기를 미루지 않도록). 캐릭터를 실제로 보여준 흐름에서만 허용한다. 재접속 복구 화면에서는 열지 않는다.
let guideIds = [];
let guideAllowed = false;
// 시트 제작자 위키가 있는 홈브류 캐릭터(scripts/sheet-wikis.json): id → 그 위키의 캐릭터 위치(#id)
let sheetWikiById = {};
function normaliseId(id) { return String(id || "").replace(/[-_]/g, "").toLowerCase(); }
function sheetWikiUrl() { return (claimState && sheetWikiById[normaliseId(claimState.characterId)]) || ""; }

function show(id) {
  ["screen-gate", "screen-char", "screen-done"].forEach(function (s) { el(s).classList.add("hidden"); });
  el(id).classList.remove("hidden");
}
function loadState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; } }
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function sbHeaders() { return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" }; }

function claimSlot(token) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/claim_slot", { method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_game_id: gameId, p_player_token: token }) })
    .then(function (res) { if (!res.ok) { return res.text().then(function (t) { throw new Error("claim 실패 (" + res.status + "): " + t); }); } return res.json(); })
    .then(function (rows) { return rows && rows.length ? rows[0] : null; });
}
function fetchSlotDetails(slotId) {
  return fetch(SUPABASE_URL + "/rest/v1/slots?id=eq." + slotId + "&select=character_id,character_name,character_ability,character_image", { headers: sbHeaders() })
    .then(function (res) { if (!res.ok) { throw new Error("슬롯 정보 로드 실패 (" + res.status + ")"); } return res.json(); })
    .then(function (rows) { return rows && rows.length ? rows[0] : null; });
}
function submitName(slotId, name) {
  var body = { player_name: name, submitted: true, submitted_at: new Date().toISOString() };
  return fetch(SUPABASE_URL + "/rest/v1/slots?id=eq." + slotId, { method: "PATCH", headers: Object.assign(sbHeaders(), { "Prefer": "return=minimal" }), body: JSON.stringify(body) })
    .then(function (res) { if (!res.ok) { return res.text().then(function (t) { throw new Error("제출 실패 (" + res.status + "): " + t); }); } });
}
function showCharacter(detail) {
  el("char-icon").classList.remove("hidden");
  el("char-name").textContent = (detail && detail.character_name) ? detail.character_name : (claimState ? claimState.characterId : "");
  el("char-ability").textContent = (detail && detail.character_ability) ? detail.character_ability : "";
  const icon = el("char-icon");
  icon.innerHTML = "";
  const imgUrl = detail ? detail.character_image : "";
  if (imgUrl) {
    const img = document.createElement("img");
    img.src = imgUrl; img.alt = "";
    img.onerror = function () { img.remove(); };
    icon.appendChild(img);
  }
  show("screen-char");
  requestAnimationFrame(function () { icon.classList.add("show"); });
  unloadGuardActive = true;
  guideAllowed = true;
  updateGuideButtons();
}
function showRecover() {
  el("char-icon").classList.add("hidden");
  el("char-name").textContent = "이미 캐릭터를 확인하셨습니다";
  el("char-ability").textContent = "아직 이름을 안 보내셨다면 아래에 입력 후 보내주세요. (캐릭터는 다시 표시되지 않습니다)";
  show("screen-char");
  unloadGuardActive = true;
}
function blockScreen(msg) {
  unloadGuardActive = false;
  el("done-msg").innerHTML = msg;
  show("screen-done");
  updateGuideButtons();
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
function hasGuide() {
  return !!(guideAllowed && claimState && claimState.characterId && (guideIds.indexOf(claimState.characterId) !== -1 || sheetWikiUrl()));
}
function updateGuideButtons() {
  el("btn-guide-done").classList.toggle("hidden", !hasGuide() || el("screen-done").classList.contains("hidden"));
  // 이름을 보낸 직후: 가이드가 있으면 버튼 안내, 없으면(번역 전 캐릭터) 예전처럼 "닫으셔도 됩니다"
  var submitted = el("screen-done").classList.contains("is-submitted");
  el("guide-tip").classList.toggle("hidden", !submitted || !(hasGuide() || tipsReady));
  el("close-tip").classList.toggle("hidden", !submitted || hasGuide() || tipsReady);
}
function openGuide() {
  el("guide-warn-overlay").classList.add("hidden");
  // 시트 제작자 위키는 새 창으로 연다. 화면 안 창(iframe)에서는 그 사이트가 캐릭터 위치(#id)로 이동하지 않았다.
  if (guideIds.indexOf(claimState.characterId) === -1 && sheetWikiUrl()) {
    window.open(sheetWikiUrl(), "_blank", "noopener");
    return;
  }
  el("guide-iframe").src = "guide.html?id=" + encodeURIComponent(claimState.characterId);
  el("guide-frame").classList.remove("hidden");
}
function closeGuide() {
  el("guide-frame").classList.add("hidden");
  el("guide-iframe").src = "about:blank";
}

// ── 플레이팁 댓글 ──
// 목록·쓰기·지우기·공감은 DB 함수(tip_*)로만. 함수가 없거나 실패하면 댓글 칸을 숨긴 채 둔다.
// 공감은 낙관적 업데이트: 누르는 즉시 바꾸고, 연타가 멈추면 마지막 상태만 보낸다. 실패하면 조용히 되돌린다.
const TIP_PAGE = 20;
// {이름} = 뽑은 캐릭터 이름, {로}·{를} = 이름 받침에 맞춘 조사
const TIP_PLACEHOLDERS = ["이번 게임을 어떻게 풀어갈 예정인가요?", "{이름}{로} 겪은 웃긴 순간은?", "{이름}{를} 처음 하는 사람에게 하고 싶은 말", "{이름}, 이렇게 하면 망한다", "{이름} 뽑은 사람에게 한마디", "밤에 어떤 캐릭터를 선택할 건가요?"];
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>';
let tipsReady = false;
let tipOffset = 0;
const tipShown = {};
function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + "-" + Math.random()); }
// 공감 중복 방지용 기기 표시. 저장소를 못 쓰면 이 화면에서만 쓰는 값.
const tipDevice = (function () {
  try { let d = localStorage.getItem("pg_tip_device"); if (!d) { d = newId(); localStorage.setItem("pg_tip_device", d); } return d; }
  catch (e) { return newId(); }
}());
function rpc(name, body) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, { method: "POST", headers: sbHeaders(), body: JSON.stringify(body) })
    .then(function (res) { if (!res.ok) { return res.text().then(function (t) { throw new Error(t); }); } return res.json(); });
}
function tipDate(iso) {
  const d = new Date(iso);
  const p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getFullYear() % 100) + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate());
}
function tipPlaceholder(name) {
  const last = name.charCodeAt(name.length - 1) - 0xAC00;
  const jong = (last >= 0 && last < 11172) ? last % 28 : 0;   // 한글이 아니면 받침 없음으로
  return TIP_PLACEHOLDERS[Math.floor(Math.random() * TIP_PLACEHOLDERS.length)]
    .replace("{이름}", name)
    .replace("{로}", (jong === 0 || jong === 8) ? "로" : "으로")
    .replace("{를}", jong === 0 ? "를" : "을");
}
function isMyTip(id) { return !!(claimState && claimState.tipIds && claimState.tipIds.indexOf(id) !== -1); }
function renderTip(row) {
  const card = document.createElement("div");
  card.className = "tip";
  const body = document.createElement("div");
  body.className = "tip-body";
  body.textContent = row.body;
  const meta = document.createElement("div");
  meta.className = "tip-meta";
  const heart = document.createElement("button");
  heart.type = "button";
  heart.className = "tip-heart";
  heart.innerHTML = HEART_SVG + "<span></span>";
  card.append(body, meta, heart);
  fillTip(card, row);
  return card;
}
// 글 카드에 id·날짜·내 글 표시·공감 상태를 채운다(보내는 중이던 카드도 저장되면 이걸로 마무리).
function fillTip(card, row) {
  const meta = card.querySelector(".tip-meta");
  const heart = card.querySelector(".tip-heart");
  const count = heart.querySelector("span");
  const mine = isMyTip(row.id);
  meta.textContent = "";
  if (mine) { const tag = document.createElement("span"); tag.className = "tip-mine"; tag.textContent = "내 글"; meta.append(tag); }
  meta.append(row.created_at ? tipDate(row.created_at) : "보내는 중");
  if (mine) {
    const del = document.createElement("button");
    del.type = "button"; del.className = "tip-del"; del.textContent = "지우기";
    del.addEventListener("click", function () { deleteTip(row.id, card); });
    meta.append(del);
  }
  const state = { confirmed: !!row.liked, confirmedCount: row.like_count || 0, shown: !!row.liked, timer: 0, busy: false };
  function paint() {
    heart.classList.toggle("on", state.shown);
    heart.setAttribute("aria-pressed", state.shown ? "true" : "false");
    count.textContent = String(state.confirmedCount + (state.shown === state.confirmed ? 0 : (state.shown ? 1 : -1)));
  }
  function send() {
    if (state.busy || state.shown === state.confirmed) { return; }
    const want = state.shown;
    state.busy = true;
    rpc("tip_like", { p_id: row.id, p_device: tipDevice, p_on: want })
      .then(function (n) { state.confirmed = want; state.confirmedCount = Number(n) || 0; })
      .catch(function () { state.shown = state.confirmed; })
      .then(function () { state.busy = false; paint(); send(); });
  }
  heart.disabled = !row.created_at;
  heart.setAttribute("aria-label", "공감");
  heart.onclick = function () {
    state.shown = !state.shown;
    paint();
    clearTimeout(state.timer);
    state.timer = setTimeout(send, 400);
  };
  paint();
}
function loadTips() {
  if (!claimState || !claimState.characterId) { return; }
  rpc("tip_list", { p_character: claimState.characterId, p_device: tipDevice, p_offset: tipOffset })
    .then(function (rows) {
      if (!Array.isArray(rows)) { return; }
      tipOffset += rows.length;
      rows.forEach(function (row) {
        if (tipShown[row.id]) { return; }
        tipShown[row.id] = true;
        el("tips-list").append(renderTip(row));
      });
      el("tips-more").classList.toggle("hidden", rows.length < TIP_PAGE);
      el("tips-empty").classList.toggle("hidden", el("tips-list").children.length > 0);
      if (!tipsReady) {
        tipsReady = true;
        el("tip-input").placeholder = tipPlaceholder(el("char-name").textContent.trim() || "이 캐릭터");
        el("tips").classList.remove("hidden");
        fitTipPlaceholder();
        updateGuideButtons();
      }
    })
    .catch(function () {});
}
function growTipInput() {
  const input = el("tip-input");
  input.style.height = "";
  if (input.value) { input.style.height = "auto"; input.style.height = input.scrollHeight + 2 + "px"; }
}
function fitTipPlaceholder() {
  const input = el("tip-input");
  const cs = getComputedStyle(input);
  const ctx = document.createElement("canvas").getContext("2d");
  const base = parseFloat(cs.fontSize);
  ctx.font = base + "px " + cs.fontFamily;
  const room = input.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
  const size = Math.max(11, Math.min(base, Math.floor(base * room / ctx.measureText(input.placeholder).width)));
  input.style.setProperty("--tip-ph-size", size + "px");
}
function postTip() {
  const input = el("tip-input");
  const text = input.value.trim();
  if (!text) { return; }
  el("tip-send").disabled = true;
  input.value = "";
  growTipInput();
  // 보내는 동안 맨 위에 흐리게 먼저 보여 준다. 실패하면 카드를 빼고 글을 입력칸에 돌려놓는다.
  const card = renderTip({ id: 0, body: text, like_count: 0 });
  card.classList.add("is-pending");
  el("tips-list").prepend(card);
  el("tips-empty").classList.add("hidden");
  rpc("tip_post", { p_slot: claimState.slotId, p_token: claimState.token, p_body: text })
    .then(function (rows) {
      const saved = rows && rows[0];
      if (!saved) { throw new Error(""); }
      claimState.tipIds = (claimState.tipIds || []).concat(saved.id);
      saveState(claimState);
      tipShown[saved.id] = true;
      card.classList.remove("is-pending");
      fillTip(card, { id: saved.id, created_at: saved.created_at, like_count: 0 });
    })
    .catch(function (err) {
      card.remove();
      el("tips-empty").classList.toggle("hidden", el("tips-list").children.length > 0);
      if (!input.value) { input.value = text; growTipInput(); }
      const m = String(err && err.message);
      window.alert(m.indexOf("limit") !== -1 ? "한 게임에서는 5개까지 쓸 수 있어요."
        : m.indexOf("duplicate") !== -1 ? "같은 글을 이미 남겼어요."
        : "글을 보내지 못했습니다. 잠시 후 다시 시도해주세요.");
    })
    .then(function () { el("tip-send").disabled = false; });
}
function deleteTip(id, card) {
  if (!window.confirm("이 글을 지울까요?")) { return; }
  rpc("tip_delete", { p_id: id, p_slot: claimState.slotId, p_token: claimState.token })
    .then(function () {
      card.remove();
      claimState.tipIds = (claimState.tipIds || []).filter(function (x) { return x !== id; });
      saveState(claimState);
      el("tips-empty").classList.toggle("hidden", el("tips-list").children.length > 0);
    })
    .catch(function () { window.alert("지우지 못했습니다. 잠시 후 다시 시도해주세요."); });
}
el("tip-input").addEventListener("input", growTipInput);
el("tip-send").addEventListener("click", postTip);
el("tips-more").addEventListener("click", loadTips);
// 첫 화면에 이야기꾼 이름을 보여 준다("OO 님의 게임입니다"). 여러 지역에서 동시에 열린 게임의
// 링크를 잘못 눌러 다른 게임의 캐릭터를 뽑지 않도록. 이름이 없는(예전) 게임은 기존 문구 그대로.
function showStoryteller() {
  const title = el("gate-title");
  fetch(SUPABASE_URL + "/rest/v1/rpc/get_game_storyteller", { method: "POST", headers: sbHeaders(), body: JSON.stringify({ p_game_id: gameId }) })
    .then(function (res) { return res.ok ? res.json() : ""; })
    .then(function (name) {
      const clean = (typeof name === "string") ? name.trim().slice(0, 20) : "";
      if (!clean) { return; }
      const strong = document.createElement("b");
      strong.textContent = clean;
      title.textContent = "";
      title.append(strong, " 님의 게임입니다.", document.createElement("br"), "당신의 캐릭터를 확인해주세요.");
    })
    .catch(function () {})
    .then(function () { title.style.visibility = ""; });
}
function init() {
  if (!gameId) { blockScreen("잘못된 링크입니다.<br>게임 정보가 없습니다."); return; }
  const st = loadState();
  if (st && st.submitted) { blockScreen("이미 캐릭터를 확인하고<br>이야기꾼에게 보냈습니다.<br><br>이 링크는 다시 사용할 수 없습니다."); return; }
  if (st && st.claimed) { claimState = st; showRecover(); return; }
  show("screen-gate");
  showStoryteller();
}
el("btn-reveal").addEventListener("click", function () { el("confirm-overlay").classList.remove("hidden"); });
el("confirm-no").addEventListener("click", function () { el("confirm-overlay").classList.add("hidden"); try { history.back(); } catch (e) {} });
el("confirm-yes").addEventListener("click", function () {
  el("confirm-overlay").classList.add("hidden");
  el("btn-reveal").disabled = true; el("btn-reveal").textContent = "확인 중...";
  const token = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + "-" + Math.random());
  claimSlot(token).then(function (slot) {
    if (!slot) { blockScreen("가방에 남은 캐릭터가 없습니다.<br>이야기꾼에게 문의하세요."); return; }
    claimState = { token: token, slotId: slot.slot_id, characterId: slot.character_id, claimed: true, submitted: false };
    saveState(claimState);
    return fetchSlotDetails(slot.slot_id).then(function (detail) { showCharacter(detail); });
  }).catch(function (err) {
    el("btn-reveal").disabled = false; el("btn-reveal").textContent = "내 캐릭터 확인하기";
    window.alert("문제가 발생했습니다:\n" + err.message);
  });
});
el("btn-submit").addEventListener("click", function () {
  const name = el("player-name").value.trim();
  if (!name) { window.alert("이름을 입력해주세요."); return; }
  el("btn-submit").disabled = true; el("btn-submit").textContent = "보내는 중...";
  submitName(claimState.slotId, name).then(function () {
    claimState.submitted = true; saveState(claimState);
    blockScreen("<b>이야기꾼에게 전달했습니다!</b><br><br>" + escapeHtml(name) + " 님, 게임이 곧 시작됩니다.");
    el("screen-done").classList.add("is-submitted");
    updateGuideButtons();
    // 다시 열면 팁·위키가 숨겨지므로(캐릭터를 보여준 흐름에서만 연다) 대기 중 실수로 닫지 않게 경고
    if (guideAllowed) { unloadGuardActive = true; loadTips(); }
  }).catch(function (err) {
    el("btn-submit").disabled = false; el("btn-submit").textContent = "이야기꾼에게 보내기";
    window.alert("문제가 발생했습니다:\n" + err.message);
  });
});
document.querySelectorAll("[data-guide-open]").forEach(function (button) {
  button.addEventListener("click", function () { if (hasGuide()) { el("guide-warn-overlay").classList.remove("hidden"); } });
});
el("guide-warn-no").addEventListener("click", function () { el("guide-warn-overlay").classList.add("hidden"); });
el("guide-warn-yes").addEventListener("click", openGuide);
el("guide-close").addEventListener("click", closeGuide);
// GitHub Pages는 10분간 캐시하므로, 배포 직후에도 새 목록을 받도록 매번 서버에 확인한다.
fetch("guide/data/index.json", { cache: "no-cache" })
  .then(function (res) { return res.ok ? res.json() : []; })
  .then(function (list) { guideIds = Array.isArray(list) ? list : []; updateGuideButtons(); })
  .catch(function () {});
fetch("scripts/sheet-wikis.json", { cache: "no-cache" })
  .then(function (res) { return res.ok ? res.json() : []; })
  .then(function (list) {
    (Array.isArray(list) ? list : []).forEach(function (wiki) {
      if (!wiki || typeof wiki.url !== "string" || wiki.url.indexOf("https://") !== 0 || !Array.isArray(wiki.ids)) { return; }
      wiki.ids.forEach(function (id) { sheetWikiById[normaliseId(id)] = wiki.url + "#" + encodeURIComponent(id); });
    });
    updateGuideButtons();
  })
  .catch(function () {});
window.addEventListener("beforeunload", function (e) { if (unloadGuardActive) { e.preventDefault(); e.returnValue = ""; } });

init();
</script>
