# 로마의 몰락 그림을 GitHub 서버에서 받아 PG+ 내장 아이콘으로 저장한다.
# 작업 공간에서 bloodstar.xyz에 연결이 안 돼서 쓰는 한 번용 지시서. 끝나면 스스로 지운다.
name: 로마의 몰락 그림 받기 (한 번용)

on:
  push:
    branches: ["claude/compassionate-bohr-vrduwh"]
    paths: [".github/workflows/fetch-fom-icons.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 변환 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: 그림 받아 webp로 바꾸기
        run: |
          set -e
          mkdir -p /tmp/png
          node -e 'require("./public/scripts/fall-of-rome.json").filter((x) => typeof x === "object").forEach((x) => console.log(x.id + " " + (x.logo || x.image)))' > /tmp/list
          fail=0
          while read -r id url; do
            curl -sSfL --retry 3 -o "/tmp/png/$id.png" "$url" && echo "OK $id" || { echo "FAIL $id $url"; fail=1; }
          done < /tmp/list
          [ "$fail" = 0 ]
          for f in /tmp/png/*.png; do
            id=$(basename "$f" .png)
            if [ "$id" = "_meta" ]; then
              convert "$f" -resize 240x240 -background none -gravity center -extent 240x240 public/guide/img/logo_fallofrome.webp
            else
              convert "$f" -resize 400x400 -background none -gravity center -extent 400x400 "public/img/official/${id}_0.webp"
            fi
          done
          ls public/img/official/*fallofrome_0.webp | wc -l
      - name: 결과 올리고 지시서 지우기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch-fom-icons.yml
          git add public/img/official public/guide/img
          git commit -q -m "로마의 몰락 아이콘 32개·로고 추가 (GitHub 서버에서 받음, 한 번용 지시서 삭제)"
          git push
